<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoogleLinkRU — Legal</title>
<style>
  :root { --ink:#1c1e21; --muted:#5c636b; --accent:#3b82f6; --bg:#ffffff; --rule:#e5e7eb; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); padding: 48px 20px; }
  main { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 1.6rem; font-weight: 650; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 6px 0 28px; font-size: .95rem; }
  ul { list-style: none; }
  li { margin-bottom: 10px; }
  a { color: var(--accent); text-decoration: none; font-size: 1.05rem; }
  a:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: .85rem; border-top: 1px solid var(--rule); margin-top: 36px; padding-top: 14px; }
</style>
</head>
<body>
<main>
  <h1>GoogleLinkRU — Legal</h1>
  <p class="sub">Legal pages for the GoogleLinkRU OAuth application</p>
  <ul>
    <li><a href="privacy.html">Privacy Policy</a></li>
    <li><a href="terms.html">Terms of Service</a></li>
  </ul>
  <div class="meta">GoogleLinkRU · Operated by Ryan Uhrich</div>
</main>
</body>
</html>
